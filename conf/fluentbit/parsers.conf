[PARSER]
    name                     docker
    format                   json
    time_key                 time
    time_format              %Y-%m-%dT%H:%M:%S.%L
    time_keep                on

[PARSER]
    name                     cri
    format                   regex
    regex                    ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<log>.*)$
    time_key                 time
    time_format              %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    name                     container_json
    format                   json
    time_key                 timestamp
    time_format              %Y-%m-%dT%H:%M:%S.%LZ
