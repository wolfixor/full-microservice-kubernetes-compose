[SERVICE]
    flush                    1
    log_level                info
    parsers_file             parsers.conf

[INPUT]
    name                     tail
    path                     /var/lib/docker/containers/*/*-json.log
    multiline.parser         docker, cri
    tag                      docker.*
    mem_buf_limit            50MB
    skip_long_lines          on
    DB                       /var/fluent-bit/pos.db
    DB.Sync                  Normal

# ─── Parse JSON log field ───
[FILTER]
    name                     parser
    match                    docker.*
    key_name                 log
    parser                   container_json
    reserve_data             on
    preserve_existing        on

# ─── Enrich records: add service name + parse non-JSON ───
[FILTER]
    name                     lua
    match                    docker.*
    script                   /fluent-bit/etc/process.lua
    call                     process_record

# ─── Elasticsearch output ───
[OUTPUT]
    name                     es
    match                    docker.*
    host                     elasticsearch
    port                     9200
    index                    docker-compose-logs-%Y.%m.%d
    generate_id              on
    retry_limit              2
    tls                      off
    suppress_type_name       on
        replace_dots             on
        time_key                 @timestamp
