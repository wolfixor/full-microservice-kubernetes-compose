version: "3.8"

services:
  # ---------------- USER SERVICE ----------------
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:user-service
    container_name: mamad-user-service
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: user-service-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0  # User service uses database 0
      REDIS_PASSWORD: ""
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: user-service
      KAFKA_PUBLISH_RETRIES: 3
    networks:
      - wolfix-service-network
    depends_on:
      user-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  user-service-db:
    image: 185.120.221.119:8083/postgres:17.10-alpine3.22
    container_name: mamad-user-service-db
    logging:
      options:
        tag: "postgresql"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./place-data/user_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wolfix-service-network




  # ---------------- TASK SERVICE ----------------
  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:task-service
    container_name: mamad-task-service
    ports:
      - "8002:8000"
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: task-service-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1  # Task service uses database 1
      REDIS_PASSWORD: ""
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: task-service
      KAFKA_PUBLISH_RETRIES: 3
    networks:
      - wolfix-service-network
    depends_on:
      task-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  task-service-db:
    image: 185.120.221.119:8083/postgres:17.10-alpine3.22
    container_name: mamad-task-service-db
    logging:
      options:
        tag: "postgresql"
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./place-data/task_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wolfix-service-network
  



  # ---------------- COMMENT SERVICE ----------------
  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:comment-service
    container_name: mamad-comment-service
    ports:
      - "8003:8000"
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: comment-service-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: comment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 2  # Comment service uses database 2
      REDIS_PASSWORD: ""
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: comment-service
      KAFKA_PUBLISH_RETRIES: 3
    networks:
      - wolfix-service-network
    depends_on:
      comment-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  comment-service-db:
    image: 185.120.221.119:8083/postgres:17.10-alpine3.22
    container_name: mamad-comment-service-db
    logging:
      options:
        tag: "postgresql"
    environment:
      POSTGRES_DB: comment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./place-data/comment_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wolfix-service-network
  
  # ---------------- SEARCH SERVICE ----------------
  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:search-service
    container_name: mamad-search-service
    ports:
      - "8004:8000"
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 3  # Search service uses database 3
      REDIS_PASSWORD: ""
      TASK_SERVICE_URL: http://task-service:8000
      COMMENT_SERVICE_URL: http://comment-service:8000
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP_ID: search-service
      KAFKA_AUTO_OFFSET_RESET: earliest
      PORT: 8000
    networks:
      - wolfix-service-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      task-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ---------------- ACTIVITY SERVICE ----------------
  activity-service:
    build:
      context: ./activity-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:activity-service
    container_name: mamad-activity-service
    ports:
      - "8005:8000"
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: activity-service-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: activity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP_ID: activity-service
      KAFKA_AUTO_OFFSET_RESET: earliest
      PORT: 8000
    networks:
      - wolfix-service-network
    depends_on:
      activity-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  activity-service-db:
    image: 185.120.221.119:8083/postgres:17.10-alpine3.22
    container_name: mamad-activity-service-db
    logging:
      options:
        tag: "postgresql"
    environment:
      POSTGRES_DB: activity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./place-data/activity_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activity_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wolfix-service-network

  # ---------------- NOTIFICATION SERVICE ----------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: registry.gitlab.shiveh.com/mapir/upstream/kibana:notification-service
    container_name: mamad-notification-service
    ports:
      - "8006:8000"
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: notification-service-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_AUTO_OFFSET_RESET: earliest
      PORT: 8000
    networks:
      - wolfix-service-network
    depends_on:
      notification-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service-db:
    image: 185.120.221.119:8083/postgres:17.10-alpine3.22
    container_name: mamad-notification-service-db
    logging:
      options:
        tag: "postgresql"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./place-data/notification_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wolfix-service-network

  # ---------------- ELASTICSEARCH ----------------
  elasticsearch:
    image: 185.120.221.119:8083/elasticsearch:8.11.0
    container_name: mamad-elasticsearch
    logging:
      options:
        tag: "elasticsearch"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./place-data/elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wolfix-service-network
    restart: unless-stopped

  # Shared Redis for all services
  redis:
    image: 185.120.221.119:8083/redis:7.4-alpine
    container_name: mamad-redis
    logging:
      options:
        tag: "redis"
    environment:
      REDIS_PASSWORD: ""
    volumes:
      - ./place-data/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wolfix-service-network
    restart: unless-stopped

  # ---------------- KAFKA EVENT BACKBONE ----------------
  kafka-1:
    image: 185.120.221.119:8083/bitnami/kafka:3.7.0
    container_name: mamad-kafka-1
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./place-data/kafka_1_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - wolfix-service-network
    restart: unless-stopped

  kafka-2:
    image: 185.120.221.119:8083/bitnami/kafka:3.7.0
    container_name: mamad-kafka-2
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./place-data/kafka_2_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - wolfix-service-network
    restart: unless-stopped

  kafka-3:
    image: 185.120.221.119:8083/bitnami/kafka:3.7.0
    container_name: mamad-kafka-3
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./place-data/kafka_3_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - wolfix-service-network
    restart: unless-stopped

  kafka-init:
    image: 185.120.221.119:8083/bitnami/kafka:3.7.0
    container_name: mamad-kafka-init
    command:
      - /bin/bash
      - -c
      - |
        set -e
        for topic in user.created user.updated task.created task.updated task.deleted comment.created comment.deleted user.created.dlq user.updated.dlq task.created.dlq task.updated.dlq task.deleted.dlq comment.created.dlq comment.deleted.dlq; do
          kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        done
    networks:
      - wolfix-service-network
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # ---------------- PROMETHEUS ----------------
  prometheus:
    image: 185.120.221.119:8083/prom/prometheus:v2.48.0
    container_name: mamad-prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=8GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    networks:
      - wolfix-service-network
    restart: unless-stopped

  # ---------------- REDIS EXPORTER ----------------
  redis-exporter:
    image: 185.120.221.119:8083/oliver006/redis_exporter:v1.56.0
    container_name: mamad-redis-exporter
    command:
      - '--redis.addr=redis://redis:6379'
      - '--check-keys=*'
    ports:
      - '9121:9121'
    networks:
      - wolfix-service-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- ELASTICSEARCH EXPORTER ----------------
  elasticsearch-exporter:
    image: 185.120.221.119:8083/prometheuscommunity/elasticsearch-exporter:v1.6.0
    container_name: mamad-elasticsearch-exporter
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
      - '--collector.clustersettings'
      - '--es.indices_settings'
      - '--es.shards'
    ports:
      - '9114:9114'
    networks:
      - wolfix-service-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- POSTGRES EXPORTERS ----------------
  postgres-exporter-user:
    image: 185.120.221.119:8083/prometheuscommunity/postgres-exporter:v0.14.0
    container_name: mamad-postgres-exporter-user
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@user-service-db:5432/user_db?sslmode=disable"
    ports:
      - '9187:9187'
    networks:
      - wolfix-service-network
    depends_on:
      user-service-db:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-task:
    image: 185.120.221.119:8083/prometheuscommunity/postgres-exporter:v0.14.0
    container_name: mamad-postgres-exporter-task
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@task-service-db:5432/task_db?sslmode=disable"
    networks:
      - wolfix-service-network
    depends_on:
      task-service-db:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-comment:
    image: 185.120.221.119:8083/prometheuscommunity/postgres-exporter:v0.14.0
    container_name: mamad-postgres-exporter-comment
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@comment-service-db:5432/comment_db?sslmode=disable"
    networks:
      - wolfix-service-network
    depends_on:
      comment-service-db:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- GRAFANA ----------------
  grafana:
    image: 185.120.221.119:8083/grafana/grafana:10.2.0
    container_name: mamad-grafana
    volumes:
      - ./grafana/prometheus-datasource.yml:/etc/grafana/provisioning/datasources/prometheus-datasource.yml
      - ./grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    networks:
      - wolfix-service-network
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  # ---------------- KIBANA ----------------
  kibana:
    image: 185.120.221.119:8083/kibana:8.11.0
    container_name: mamad-kibana
    volumes:
      - ./conf/kibana:/usr/share/kibana/config
    ports:
      - "5601:5601"
    networks:
      - wolfix-service-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- FLUENT BIT (LOG COLLECTOR) ----------------
  fluentbit:
    image: 185.120.221.119:8083/fluent/fluent-bit:3.0.7
    container_name: mamad-fluentbit
    volumes:
      - ./conf/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./conf/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./conf/fluentbit/process.lua:/fluent-bit/etc/process.lua
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    ports:
      - "2020:2020"
    networks:
      - wolfix-service-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- NODE EXPORTER ----------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: mamad-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - wolfix-service-network
    restart: unless-stopped

# ---------------- VOLUMES ----------------
volumes:
  prometheus_data:
  grafana_data:

# ---------------- NETWORKS ----------------
networks:
  wolfix-service-network:
