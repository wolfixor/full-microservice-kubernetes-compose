apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: task-service
  namespace: task-api
  labels:
    app: task-service
spec:
  replicas: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: task-service
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 10
      - pause:
          duration: 60s
      - analysis:
          templates:
          - templateName: task-service-success-rate
      - setWeight: 25
      - pause:
          duration: 60s
      - analysis:
          templates:
          - templateName: task-service-success-rate
      - setWeight: 50
      - pause:
          duration: 60s
      - analysis:
          templates:
          - templateName: task-service-success-rate
      - setWeight: 100
  template:
    metadata:
      labels:
        app: task-service
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-31T12:31:00+03:30"
    spec:
      containers:
      - name: task-service
        image: registry.gitlab.shiveh.com/mapir/upstream/kibana:task-service
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_HOST
          value: "task-db-pooler-rw"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "task_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: task-db-app
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-app
              key: password
        - name: REDIS_HOST
          value: "redis-cluster"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: REDIS_CLUSTER_ENABLED
          value: "true"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: REDIS_PASSWORD
        - name: REDIS_KEY_PREFIX
          value: "task"
        - name: CACHE_EXPIRE_SECONDS
          value: "300"
        - name: ROOT_PATH
          value: "/tasks"
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "platform-kafka-kafka-bootstrap.kafka.svc:9092"
        - name: KAFKA_CLIENT_ID
          value: "task-service"
        - name: KAFKA_PUBLISH_RETRIES
          value: "3"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: task-api
  labels:
    app: task-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: task-service
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
