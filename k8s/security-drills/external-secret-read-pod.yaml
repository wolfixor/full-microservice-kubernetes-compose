apiVersion: v1
kind: Pod
metadata:
  name: external-secret-read
  namespace: task-api
  labels:
    app: external-secret-read
    version: local
    team: platform
    policy.openai.local/skip-probes: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: reader
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "username=$USERNAME"
      echo "password=$PASSWORD"
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: task-api-config
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: task-api-config
          key: password
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
