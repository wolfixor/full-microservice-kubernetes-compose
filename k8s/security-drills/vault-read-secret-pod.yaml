apiVersion: v1
kind: Pod
metadata:
  name: vault-read-secret
  namespace: task-api
  labels:
    app: vault-read-secret
    version: local
    team: platform
    policy.openai.local/skip-probes: "true"
spec:
  serviceAccountName: vault-secret-reader
  automountServiceAccountToken: true
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command:
    - sh
    - -c
    - |
      JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      VAULT_TOKEN="$(
        curl -s \
          --request POST \
          --data "{\"jwt\":\"$JWT\",\"role\":\"task-api\"}" \
          http://vault.vault.svc:8200/v1/auth/kubernetes/login \
        | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p'
      )"
      echo "Vault login token length: ${#VAULT_TOKEN}"
      curl -s \
        -H "X-Vault-Token: $VAULT_TOKEN" \
        http://vault.vault.svc:8200/v1/secret/data/task-api/config
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
