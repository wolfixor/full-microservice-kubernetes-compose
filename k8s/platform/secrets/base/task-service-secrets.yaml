apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: task-service-db
  namespace: task-api
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-task-api
    kind: SecretStore
  target:
    name: task-service-db-from-vault
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: task-service/db
      property: username
  - secretKey: password
    remoteRef:
      key: task-service/db
      property: password
