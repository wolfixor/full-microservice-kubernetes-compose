apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: task-db
  namespace: task-api
  labels:
    app: task-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:15.8
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: task_db
      owner: task_app
      secret:
        name: task-db-app

  storage:
    size: 1Gi

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://cnpg/task-db
      endpointURL: http://minio.velero.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: task-db-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: task-db-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
