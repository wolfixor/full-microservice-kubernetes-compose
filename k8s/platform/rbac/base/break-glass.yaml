apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-api-break-glass
  namespace: task-api
  labels:
    app.kubernetes.io/part-of: task-api
    access.openai.local/type: break-glass
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec", "services", "endpoints", "configmaps", "events", "secrets"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-api-break-glass
  namespace: task-api
  labels:
    app.kubernetes.io/part-of: task-api
    access.openai.local/type: break-glass
  annotations:
    access.openai.local/reason: "Temporary emergency access. Remove after incident."
subjects:
- kind: Group
  name: platform-break-glass
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: task-api-break-glass
  apiGroup: rbac.authorization.k8s.io
