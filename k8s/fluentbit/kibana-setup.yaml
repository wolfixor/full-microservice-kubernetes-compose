apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-setup
  namespace: task-api
data:
  setup.sh: |
    #!/bin/sh
    set -e

    KIBANA_URL="${KIBANA_URL:-http://kibana:5601}"
    MAX_RETRIES=30
    RETRY_INTERVAL=5

    echo "Waiting for Kibana to be ready..."
    retries=0
    until curl -s "$KIBANA_URL/api/status" | grep -q '"level":"available"'; do
      retries=$((retries + 1))
      if [ "$retries" -ge "$MAX_RETRIES" ]; then
        echo "Timeout waiting for Kibana"
        exit 1
      fi
      sleep "$RETRY_INTERVAL"
    done
    echo "Kibana is ready!"

    # ── Create index pattern ──
    echo "Creating index pattern: kubernetes-logs-*"
    curl -s -X POST "$KIBANA_URL/api/data_views/data_view" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d '{
        "data_view": {
          "title": "kubernetes-logs-*",
          "name": "Kubernetes Logs",
          "timeFieldName": "@timestamp"
        }
      }' && echo "" || echo "Index pattern may already exist, continuing..."

    # ── Wait for index pattern to be available ──
    sleep 2

    # ── Create visualizations ──
    echo "Creating visualizations..."

    # 1. Log volume over time
    LOG_VOLUME_ID=$(curl -s -X POST "$KIBANA_URL/api/saved_objects/visualization" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d '{
        "attributes": {
          "title": "Log Volume Over Time",
          "visState": "{\"type\":\"area\",\"params\":{\"addTimeMarker\":true,\"addLegend\":true,\"categoryAxes\":[{\"id\":\"CategoryAxis-1\",\"labels\":{\"show\":true},\"position\":\"bottom\",\"scale\":{\"type\":\"linear\"},\"show\":true,\"type\":\"category\"}],\"grid\":{\"categoryLines\":false},\"legendPosition\":\"right\",\"seriesParams\":[{\"data\":{\"id\":\"1\",\"label\":\"Count\"},\"drawLinesBetweenPoints\":true,\"interpolate\":\"linear\",\"mode\":\"normal\",\"show\":true,\"showCircles\":true,\"type\":\"area\",\"valueAxis\":\"ValueAxis-1\"}],\"times\":[],\"type\":\"area\",\"valueAxes\":[{\"id\":\"ValueAxis-1\",\"labels\":{\"filter\":false,\"rotate\":0,\"show\":true,\"truncate\":100},\"name\":\"LeftAxis-1\",\"position\":\"left\",\"scale\":{\"mode\":\"normal\",\"type\":\"linear\"},\"show\":true,\"type\":\"value\"}]},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"date_histogram\",\"schema\":\"segment\",\"params\":{\"field\":\"@timestamp\",\"useNormalizedEsInterval\":true,\"interval\":\"auto\",\"drop_partials\":false,\"min_doc_count\":1,\"extended_bounds\":{}}}]}",
          "uiStateJSON": "{}",
          "description": "Log volume over time across all services",
          "version": 1,
          "kibanaSavedObjectMeta": {
            "searchSourceJSON": "{\"index\":\"kubernetes-logs-*\",\"query\":{\"query\":\"\",\"language\":\"kuery\"},\"filter\":[]}"
          }
        }
      }' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    echo "Log volume visualization ID: $LOG_VOLUME_ID"

    # 2. Log level breakdown
    LEVEL_PIE_ID=$(curl -s -X POST "$KIBANA_URL/api/saved_objects/visualization" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d '{
        "attributes": {
          "title": "Log Level Distribution",
          "visState": "{\"type\":\"pie\",\"params\":{\"addLegend\":true,\"addTooltip\":true,\"legendPosition\":\"right\",\"isDonut\":true,\"labels\":{\"show\":true,\"values\":true,\"lastLevel\":false,\"truncate\":100},\"type\":\"pie\"},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"terms\",\"schema\":\"segment\",\"params\":{\"field\":\"level\",\"size\":10,\"order\":\"desc\",\"orderBy\":\"1\",\"otherBucket\":true,\"otherBucketLabel\":\"Other\",\"missingBucket\":false}}]}",
          "uiStateJSON": "{}",
          "description": "Breakdown of log entries by level",
          "version": 1,
          "kibanaSavedObjectMeta": {
            "searchSourceJSON": "{\"index\":\"kubernetes-logs-*\",\"query\":{\"query\":\"\",\"language\":\"kuery\"},\"filter\":[]}"
          }
        }
      }' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    echo "Level pie visualization ID: $LEVEL_PIE_ID"

    # 3. Service breakdown
    SERVICE_PIE_ID=$(curl -s -X POST "$KIBANA_URL/api/saved_objects/visualization" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d '{
        "attributes": {
          "title": "Logs by Service",
          "visState": "{\"type\":\"pie\",\"params\":{\"addLegend\":true,\"addTooltip\":true,\"legendPosition\":\"right\",\"isDonut\":true,\"labels\":{\"show\":true,\"values\":true,\"lastLevel\":false,\"truncate\":100},\"type\":\"pie\"},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"terms\",\"schema\":\"segment\",\"params\":{\"field\":\"service\",\"size\":15,\"order\":\"desc\",\"orderBy\":\"1\",\"otherBucket\":true,\"otherBucketLabel\":\"Other\",\"missingBucket\":false}}]}",
          "uiStateJSON": "{}",
          "description": "Log volume by service",
          "version": 1,
          "kibanaSavedObjectMeta": {
            "searchSourceJSON": "{\"index\":\"kubernetes-logs-*\",\"query\":{\"query\":\"\",\"language\":\"kuery\"},\"filter\":[]}"
          }
        }
      }' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    echo "Service pie visualization ID: $SERVICE_PIE_ID"

    # 4. Errors over time
    ERROR_VOLUME_ID=$(curl -s -X POST "$KIBANA_URL/api/saved_objects/visualization" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d '{
        "attributes": {
          "title": "Errors & Warnings Over Time",
          "visState": "{\"type\":\"bar\",\"params\":{\"addLegend\":true,\"addTimeMarker\":true,\"categoryAxes\":[{\"id\":\"CategoryAxis-1\",\"labels\":{\"show\":true},\"position\":\"bottom\",\"scale\":{\"type\":\"linear\"},\"show\":true,\"type\":\"category\"}],\"grid\":{\"categoryLines\":false},\"legendPosition\":\"right\",\"seriesParams\":[{\"data\":{\"id\":\"1\",\"label\":\"Count\"},\"drawLinesBetweenPoints\":true,\"interpolate\":\"linear\",\"mode\":\"normal\",\"show\":true,\"showCircles\":true,\"type\":\"histogram\",\"valueAxis\":\"ValueAxis-1\"}],\"times\":[],\"type\":\"histogram\",\"valueAxes\":[{\"id\":\"ValueAxis-1\",\"labels\":{\"filter\":false,\"rotate\":0,\"show\":true,\"truncate\":100},\"name\":\"LeftAxis-1\",\"position\":\"left\",\"scale\":{\"mode\":\"normal\",\"type\":\"linear\"},\"show\":true,\"type\":\"value\"}]},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"date_histogram\",\"schema\":\"segment\",\"params\":{\"field\":\"@timestamp\",\"useNormalizedEsInterval\":true,\"interval\":\"auto\",\"drop_partials\":false,\"min_doc_count\":1,\"extended_bounds\":{}}},{\"id\":\"3\",\"enabled\":true,\"type\":\"filters\",\"schema\":\"group\",\"params\":{\"filters\":[{\"input\":{\"query\":\"level: ERROR OR level: WARNING OR level: WARN OR level: error\"},\"label\":\"Errors & Warnings\"}]}}]}",
          "uiStateJSON": "{}",
          "description": "Error and warning log volume over time",
          "version": 1,
          "kibanaSavedObjectMeta": {
            "searchSourceJSON": "{\"index\":\"kubernetes-logs-*\",\"query\":{\"query\":\"\",\"language\":\"kuery\"},\"filter\":[]}"
          }
        }
      }' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    echo "Errors visualization ID: $ERROR_VOLUME_ID"

    # ── Create dashboard ──
    echo "Creating Log Overview dashboard..."
    DASHBOARD_ID=$(curl -s -X POST "$KIBANA_URL/api/saved_objects/dashboard" \
      -H "Content-Type: application/json" \
      -H "kbn-xsrf: true" \
      -d "{
        \"attributes\": {
          \"title\": \"Log Overview\",
          \"hits\": 0,
          \"description\": \"Centralized log dashboard for all microservices\",
          \"panelsJSON\": \"[{\\\"version\\\":\\\"8.11.0\\\",\\\"gridData\\\":{\\\"x\\\":0,\\\"y\\\":0,\\\"w\\\":48,\\\"h\\\":15,\\\"i\\\":\\\"1\\\"},\\\"panelIndex\\\":\\\"1\\\",\\\"embeddableConfig\\\":{},\\\"panelRefName\\\":\\\"panel_0\\\"},{\\\"version\\\":\\\"8.11.0\\\",\\\"gridData\\\":{\\\"x\\\":0,\\\"y\\\":15,\\\"w\\\":24,\\\"h\\\":15,\\\"i\\\":\\\"2\\\"},\\\"panelIndex\\\":\\\"2\\\",\\\"embeddableConfig\\\":{},\\\"panelRefName\\\":\\\"panel_1\\\"},{\\\"version\\\":\\\"8.11.0\\\",\\\"gridData\\\":{\\\"x\\\":24,\\\"y\\\":15,\\\"w\\\":24,\\\"h\\\":15,\\\"i\\\":\\\"3\\\"},\\\"panelIndex\\\":\\\"3\\\",\\\"embeddableConfig\\\":{},\\\"panelRefName\\\":\\\"panel_2\\\"},{\\\"version\\\":\\\"8.11.0\\\",\\\"gridData\\\":{\\\"x\\\":0,\\\"y\\\":30,\\\"w\\\":48,\\\"h\\\":15,\\\"i\\\":\\\"4\\\"},\\\"panelIndex\\\":\\\"4\\\",\\\"embeddableConfig\\\":{},\\\"panelRefName\\\":\\\"panel_3\\\"}]\",
          \"optionsJSON\": \"{\\\"useMargins\\\":true,\\\"hidePanelTitles\\\":false}\",
          \"version\": 1,
          \"timeRestore\": false,
          \"kibanaSavedObjectMeta\": {
            \"searchSourceJSON\": \"{\\\"query\\\":{\\\"query\\\":\\\"\\\",\\\"language\\\":\\\"kuery\\\"},\\\"filter\\\":[]}\"
          }
        },
        \"references\": [
          {\"name\":\"panel_0\",\"type\":\"visualization\",\"id\":\"$LOG_VOLUME_ID\"},
          {\"name\":\"panel_1\",\"type\":\"visualization\",\"id\":\"$LEVEL_PIE_ID\"},
          {\"name\":\"panel_2\",\"type\":\"visualization\",\"id\":\"$SERVICE_PIE_ID\"},
          {\"name\":\"panel_3\",\"type\":\"visualization\",\"id\":\"$ERROR_VOLUME_ID\"}
        ]
      }" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    echo "Dashboard created with ID: $DASHBOARD_ID"
    echo "Setup complete!"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  namespace: task-api
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup
        image: docker.arvancloud.ir/curlimages/curl:8.7.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/setup.sh"]
        env:
        - name: KIBANA_URL
          value: "http://kibana:5601"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: kibana-setup
