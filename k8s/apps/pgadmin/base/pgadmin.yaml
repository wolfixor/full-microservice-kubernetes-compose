apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: task-api
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "task-db via PgBouncer",
          "Group": "Kubernetes",
          "Host": "task-db-pooler-rw.task-api.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "task_db",
          "Username": "task_app",
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: task-api
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      serviceAccountName: task-api-workload
      automountServiceAccountToken: false
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:8.14
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          valueFrom:
            secretKeyRef:
              name: pgadmin
              key: PGADMIN_DEFAULT_EMAIL
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgadmin
              key: PGADMIN_DEFAULT_PASSWORD
        volumeMounts:
        - name: servers
          mountPath: /pgadmin4/servers.json
          subPath: servers.json
          readOnly: true
      volumes:
      - name: servers
        configMap:
          name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: task-api
  labels:
    app: pgadmin
spec:
  selector:
    app: pgadmin
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
