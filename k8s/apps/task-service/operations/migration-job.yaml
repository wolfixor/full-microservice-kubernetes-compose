apiVersion: batch/v1
kind: Job
metadata:
  name: task-service-migrations
  namespace: task-api
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: registry.gitlab.shiveh.com/mapir/upstream/kibana:task-service
        command: ["/bin/bash", "-c", "alembic upgrade head"]
        env:
        - name: POSTGRES_HOST
          value: "task-db-rw"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "task_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: task-db-app
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-app
              key: password
      restartPolicy: Never
  backoffLimit: 3
