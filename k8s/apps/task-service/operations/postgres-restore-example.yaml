apiVersion: v1
kind: Namespace
metadata:
  name: task-api-restore
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: task-db-restore
  namespace: task-api-restore
  labels:
    app: task-db-restore
spec:
  # Provision task-db-app and task-db-backup-s3 in this namespace through
  # External Secrets before starting this recovery drill.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:15.8

  bootstrap:
    recovery:
      source: task-db-backup
      # For PITR practice, uncomment and set a timestamp before the bad write.
      recoveryTarget:
        targetTime: "2026-08-16T10:12:38.65514Z"

  externalClusters:
  - name: task-db-backup
    barmanObjectStore:
      destinationPath: s3://cnpg/task-db
      endpointURL: http://minio.velero.svc.cluster.local:9000
      serverName: task-db
      s3Credentials:
        accessKeyId:
          name: task-db-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: task-db-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        maxParallel: 4

  storage:
    size: 1Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
