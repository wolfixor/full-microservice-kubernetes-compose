apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: task-api
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.arvancloud.ir/kibana:9.4.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-es-http:9200"
        # - name: ELASTICSEARCH_USERNAME
        #   value: "elastic"
        # - name: ELASTICSEARCH_PASSWORD
        #   value: "6Ta3x9lqaa03avP9B7k515ru"
        resources:
          requests:
            memory: "500Mi"
            cpu: "400m"
          limits:
            memory: "1000Mi"
            cpu: "800m"
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 240
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: task-api
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
  type: ClusterIP