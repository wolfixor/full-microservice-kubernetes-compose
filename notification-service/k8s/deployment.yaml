apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: task-api
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: registry.gitlab.shiveh.com/mapir/upstream/kibana:notification-service
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_HOST
          value: "notification-service-db"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "notification_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: ROOT_PATH
          value: "/notifications"
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "platform-kafka-kafka-bootstrap.kafka.svc:9092"
        - name: KAFKA_CONSUMER_GROUP_ID
          value: "notification-service"
        - name: KAFKA_AUTO_OFFSET_RESET
          value: "earliest"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: task-api
  labels:
    app: notification-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: notification-service
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
